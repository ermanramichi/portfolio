<section id="contact" class="section">
  <div class="shell">

    <header class="head" data-aos="fade-up">
      <span class="head__index">03 / Contact</span>
      <h2 class="head__title">Say hello</h2>
    </header>

    <div class="contact">
      <div class="contact__left" data-aos="fade-up">
        <p class="contact__lede">
          Open to side projects and freelance work alongside my day job — or just
          a good conversation about the web.
        </p>

        <a href="mailto:ermanramiqi&#64;icloud.com" class="contact__mail">
          ermanramiqi&#64;icloud.com
        </a>

        <div class="contact__actions">
          <a href="assets/erman-ramichi.pdf" download class="act">Resume ↓</a>
        </div>
      </div>

      <ul class="contact__links" data-aos="fade-up" data-aos-delay="80">
        @for (link of socials; track link.label; let i = $index) {
          <li>
            <a [href]="link.url" target="_blank" rel="noopener">
              <i [class]="link.icon" aria-hidden="true"></i>
              <span class="contact__label">{{ link.label }}</span>
              <span class="contact__handle">{{ link.handle }}</span>
              <span class="contact__out" aria-hidden="true">↗</span>
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</section>
