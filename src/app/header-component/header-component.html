<header class="nav" [class.nav--scrolled]="scrolled()">
  <div class="shell nav__bar">

    <!-- Monogram -->
    <a href="#home" class="brand" (click)="goTo($event, 'home')" aria-label="Erman Ramichi — home">
      <span class="brand__mark">ER</span>
      <span class="brand__text">
        <span class="brand__name">Erman Ramichi</span>
        <span class="brand__role">Software Engineer</span>
      </span>
    </a>

    <!-- Desktop nav -->
    <nav class="nav__links" aria-label="Primary">
      @for (link of links; track link.id) {
        <a
          [href]="'#' + link.id"
          class="nav__link"
          [class.is-active]="active() === link.id"
          (click)="goTo($event, link.id)"
          >{{ link.label }}</a
        >
      }
    </nav>

    <div class="nav__end">
      <a href="assets/erman-ramichi.pdf" download class="btn btn-primary nav__cv">
        <i class="fa-solid fa-arrow-down-long" aria-hidden="true"></i>
        Resume
      </a>

      <!-- Burger -->
      <button
        type="button"
        class="burger"
        [class.is-open]="menuOpen()"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        aria-label="Toggle navigation menu"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<!-- Mobile sheet -->
<div
  id="mobile-menu"
  class="sheet"
  [class.is-open]="menuOpen()"
  [attr.aria-hidden]="!menuOpen()"
  [attr.inert]="menuOpen() ? null : ''"
>
  <nav class="sheet__inner" aria-label="Mobile">
    @for (link of links; track link.id; let i = $index) {
      <a
        [href]="'#' + link.id"
        class="sheet__link"
        [class.is-active]="active() === link.id"
        [style.--d]="i * 55 + 'ms'"
        (click)="goTo($event, link.id)"
      >
        <span class="sheet__index">0{{ i + 1 }}</span>
        <span>{{ link.label }}</span>
      </a>
    }

    <a
      href="assets/erman-ramichi.pdf"
      download
      class="btn btn-primary sheet__cv"
      [style.--d]="links.length * 55 + 'ms'"
      (click)="closeMenu()"
    >
      <i class="fa-solid fa-arrow-down-long" aria-hidden="true"></i>
      Download Resume
    </a>

    <div class="sheet__socials" [style.--d]="(links.length + 1) * 55 + 'ms'">
      <a href="https://github.com/ermanramichi" target="_blank" rel="noopener" aria-label="GitHub">
        <i class="fa-brands fa-github" aria-hidden="true"></i>
      </a>
      <a href="https://mk.linkedin.com/in/ermanramichi" target="_blank" rel="noopener" aria-label="LinkedIn">
        <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>
      </a>
      <a href="https://www.instagram.com/ermanramiqi" target="_blank" rel="noopener" aria-label="Instagram">
        <i class="fa-brands fa-instagram" aria-hidden="true"></i>
      </a>
      <a href="https://www.facebook.com/ermanzz" target="_blank" rel="noopener" aria-label="Facebook">
        <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
      </a>
    </div>
  </nav>
</div>
