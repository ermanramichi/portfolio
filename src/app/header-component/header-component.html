<header class="nav" [class.nav--scrolled]="scrolled()">
  <div class="shell nav__bar">

    <a href="#home" class="brand" (click)="goTo($event, 'home')">
      <span class="brand__name">Erman Ramichi</span>
      <span class="brand__sep">/</span>
      <span class="brand__role">Software Engineer</span>
    </a>

    <nav class="nav__links" aria-label="Primary">
      @for (link of links; track link.id; let i = $index) {
        <a
          [href]="'#' + link.id"
          class="nav__link"
          [class.is-active]="active() === link.id"
          (click)="goTo($event, link.id)"
        >
          <span class="nav__num">0{{ i + 1 }}</span>
          {{ link.label }}
        </a>
      }
      <a href="assets/erman-ramichi.pdf" download class="nav__cv">Resume ↓</a>
    </nav>

    <button
      type="button"
      class="burger"
      [class.is-open]="menuOpen()"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      aria-label="Toggle navigation menu"
    >
      <span></span><span></span>
    </button>
  </div>
</header>

<!-- Mobile sheet -->
<div
  id="mobile-menu"
  class="sheet"
  [class.is-open]="menuOpen()"
  [attr.aria-hidden]="!menuOpen()"
  [attr.inert]="menuOpen() ? null : ''"
>
  <nav class="sheet__inner" aria-label="Mobile">
    <span class="label sheet__caption">Index</span>

    @for (link of links; track link.id; let i = $index) {
      <a
        [href]="'#' + link.id"
        class="sheet__link"
        [class.is-active]="active() === link.id"
        [style.--d]="i * 50 + 'ms'"
        (click)="goTo($event, link.id)"
      >
        <span class="sheet__num">0{{ i + 1 }}</span>
        <span class="sheet__word">{{ link.label }}</span>
        <span class="sheet__tick">→</span>
      </a>
    }

    <div class="sheet__foot" [style.--d]="links.length * 50 + 'ms'">
      <a href="assets/erman-ramichi.pdf" download class="act" (click)="closeMenu()">Resume ↓</a>
      <div class="sheet__socials">
        <a href="https://github.com/ermanramichi" target="_blank" rel="noopener">GitHub</a>
        <a href="https://mk.linkedin.com/in/ermanramichi" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://www.instagram.com/ermanramiqi" target="_blank" rel="noopener">Instagram</a>
      </div>
    </div>
  </nav>
</div>
